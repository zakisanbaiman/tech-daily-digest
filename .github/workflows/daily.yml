name: daily-digest

on:
  schedule:
    - cron: "0 22 * * *" # 7:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-archive
          path: archive/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-site

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-archive
          path: archive-upload
      - name: Commit today's archive
        run: |
          set -euo pipefail
          copied=0
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            if [[ ! "$base" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$ ]]; then
              continue
            fi
            if [[ -L "$file" ]]; then
              echo "skip symlink: $base" >&2
              continue
            fi
            size=$(stat -c%s "$file")
            if (( size > 2000000 )); then
              echo "skip oversized archive file: $base" >&2
              continue
            fi
            cp "$file" "archive/$base"
            copied=$((copied + 1))
          done < <(find archive-upload -type f -print0)
          if (( copied == 0 )); then
            echo "no archive html files found" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

  deploy:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
